spring.application.name=medical-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.jndi-name=${DATASOURCE_JNDI_NAME:jdbc/MedicalDS}

local.datasource.url=${DATABASE_URL:jdbc:oracle:thin:@localhost:1521:XE}
local.datasource.username=${DATABASE_USERNAME:}
local.datasource.password=${DATABASE_PASSWORD:}
local.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jta.enabled=false
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
