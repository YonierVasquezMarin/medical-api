spring.application.name=medical-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.jndi-name=${DATASOURCE_JNDI_NAME:java:comp/env/jdbc/MedicalDS}

local.datasource.url=${DATABASE_URL:jdbc:oracle:thin:@localhost:1521:XE}
local.datasource.username=${DATABASE_USERNAME:}
local.datasource.password=${DATABASE_PASSWORD:}
local.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
